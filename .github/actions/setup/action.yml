name: Set up Node and dependencies
description: Install the Node version from package.json engines and the npm packages, without lifecycle scripts.

inputs:
  cache:
    description: "'true' restores and saves the npm download cache."
    default: 'true'

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: package.json
        cache: ${{ inputs.cache == 'true' && 'npm' || '' }}
        package-manager-cache: false
    # --ignore-scripts: no lifecycle scripts. On Linux two packages have one, and nothing here needs
    # them: esbuild (a faster command line; the API finds the binary in @esbuild/*) and
    # @vscode/vsce-sign (the signing tool).
    # --allow-git=none: npm prepares a git dependency in its clone, where the .npmrc of that
    # dependency can name a program to run, also with --ignore-scripts. None is in the lock file.
    - name: Install dependencies
      shell: bash
      run: npm ci --ignore-scripts --allow-git=none
