name: Set up Node and dependencies
description: Install the Node version from package.json engines and the npm packages, without lifecycle scripts.

inputs:
  cache:
    description: "'true' restores and saves the npm download cache."
    default: 'true'

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: package.json
        cache: ${{ inputs.cache == 'true' && 'npm' || '' }}
        package-manager-cache: false
    # No package gets to run code by being installed. On Linux two have a script, and nothing here
    # needs them: esbuild (a faster command line; the API finds the binary in @esbuild/*) and
    # @vscode/vsce-sign (the signing tool).
    - name: Install dependencies
      shell: bash
      run: npm ci --ignore-scripts
