name: Release

on:
  push:
    branches: [main]

permissions: {}

# One run at a time, never cancelled: two runs would race on the release pull request.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euo pipefail {0}

# release-please -> (release created) package -> publish.
# npm runs only in `package`, with a read-only token. Only `publish` can write to the release, and
# it runs no code from the repository or from npm.
jobs:
  release-please:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions: {}
    outputs:
      tag: ${{ steps.release.outputs.tag_name || steps.rerun.outputs.tag }}
    steps:
      # App token instead of GITHUB_TOKEN, so the release pull request starts CI.
      # contents: release branch, tag and release; pull-requests: the release pull request and its
      # `autorelease: *` labels.
      - name: Create the App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # A rerun of this job does not create the release again, so it reports no tag. If the first
      # attempt already tagged this commit, continue with that tag.
      - name: Find the release of an earlier attempt
        id: rerun
        if: github.run_attempt > 1 && steps.release.outputs.release_created != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          version="$(gh api "repos/$REPO/contents/.release-please-manifest.json?ref=$SHA" \
            --jq '.content | @base64d | fromjson | .["."]')"
          tag="$(gh api "repos/$REPO/git/matching-refs/tags/v$version" |
            jq -r --arg tag "v$version" --arg sha "$SHA" \
              '.[] | select(.ref == "refs/tags/" + $tag and .object.sha == $sha) | $tag')"
          echo "Tag of this commit: ${tag:-none}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  package:
    needs: release-please
    if: needs.release-please.outputs.tag != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - name: Compare the package version with the tag
        run: |
          version="$(jq -r .version package.json)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::package.json has version $version, the tag is $TAG"
            exit 1
          fi
      - name: Set up
        uses: ./.github/actions/setup
      - name: Check
        run: npm run check
      - name: Package
        run: npm run package
      - name: Check the .vsix
        run: npm run check:vsix -- "vscode-ext-demo-${TAG#v}.vsix"
      # overwrite: a rerun uploads the same name again.
      - name: Upload the .vsix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-vsix
          path: vscode-ext-demo-*.vsix
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Job summary
        run: |
          file="vscode-ext-demo-${TAG#v}.vsix"
          echo "Packaged \`$file\` from \`$TAG\`, SHA-256 \`$(sha256sum "$file" | cut -d ' ' -f 1)\`." \
            >> "$GITHUB_STEP_SUMMARY"

  # The only job that can write to the release: no checkout, no npm.
  publish:
    needs: [release-please, package]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - name: Download the .vsix
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-vsix
      # --clobber: a rerun replaces the file.
      - name: Attach the .vsix to the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" --repo "$REPO" --clobber "vscode-ext-demo-${TAG#v}.vsix"
      - name: Job summary
        env:
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.release-please.outputs.tag }}
        run: |
          file="vscode-ext-demo-${TAG#v}.vsix"
          echo "Attached \`$file\` to [$TAG]($RELEASE_URL), SHA-256 \`$(sha256sum "$file" | cut -d ' ' -f 1)\`." \
            >> "$GITHUB_STEP_SUMMARY"
