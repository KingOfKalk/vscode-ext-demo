name: Release

on:
  push:
    branches: [main]

permissions: {}

# One run at a time, never cancelled: two runs would race on the release pull request.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euo pipefail {0}

# release-please -> find-release -> (the latest release has no .vsix) package -> publish.
# npm runs only in `package`, with a read-only token. That job does not run `npm run check`: the
# required checks passed on the same tree, and the tools it starts (eslint, vitest, …) are
# auto-merged by Dependabot and could change the .vsix before the upload. Only `publish` can write
# to the release, and it runs no code from the repository or from npm.
jobs:
  release-please:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions: {}
    steps:
      # App token instead of GITHUB_TOKEN, so the release pull request starts CI.
      # contents: release branch, tag and release; pull-requests: the release pull request and its
      # `autorelease: *` labels.
      - name: Create the App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Looks at the latest release instead of at the outputs of release-please, which reports a release
  # only in the attempt that created it. So a missing file is added by any rerun and by the next
  # push, also after release-please failed behind the release. It is not attached twice.
  find-release:
    needs: release-please
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.find.outputs.tag }}
    steps:
      - name: Find the latest release without a .vsix
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if ! release="$(gh api "repos/$REPO/releases/latest" 2> "$RUNNER_TEMP/error.txt")"; then
            cat "$RUNNER_TEMP/error.txt" >&2
            if ! grep -qF '(HTTP 404)' "$RUNNER_TEMP/error.txt"; then
              exit 1
            fi
            echo "There is no release yet."
            exit 0
          fi
          tag="$(jq -r .tag_name <<< "$release")"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag of the latest release is not vX.Y.Z"
            exit 1
          fi
          # An upload that broke off leaves an asset in another state.
          attached="$(jq --arg file "vscode-ext-demo-${tag#v}.vsix" \
            'any(.assets[]; .name == $file and .state == "uploaded")' <<< "$release")"
          if [ "$attached" = true ]; then
            echo "$tag has its .vsix."
          else
            echo "$tag has no .vsix."
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

  # `!cancelled()` here and below: without it a failed release-please skips the jobs.
  package:
    needs: find-release
    if: ${{ !cancelled() && needs.find-release.result == 'success' && needs.find-release.outputs.tag != '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAG: ${{ needs.find-release.outputs.tag }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.find-release.outputs.tag }}
          persist-credentials: false
      - name: Compare the package version with the tag
        run: |
          version="$(jq -r .version package.json)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::package.json has version $version, the tag is $TAG"
            exit 1
          fi
      - name: Set up
        uses: ./.github/actions/setup
        with:
          cache: 'false'
      - name: Package
        run: npm run package
      - name: Check the .vsix
        run: npm run check:vsix -- "vscode-ext-demo-${TAG#v}.vsix"
      # VS Code is downloaded, not taken from the cache.
      - name: Install system packages
        run: scripts/install-system-deps.sh
      - name: Smoke tests
        id: smoke
        run: npm run test:smoke -- --report "$RUNNER_TEMP/smoke.json" "vscode-ext-demo-${TAG#v}.vsix"
      - name: Smoke tests summary
        if: ${{ !cancelled() }}
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          version="$(jq -er '.engines.vscode | ltrimstr("^")' package.json)"
          node scripts/ci-summary.mjs test --title "Smoke tests in VS Code $version" \
            --report "$RUNNER_TEMP/smoke.json" --root "$GITHUB_WORKSPACE" \
            --outcome "$SMOKE_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
      # overwrite: a rerun uploads the same name again.
      - name: Upload the .vsix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-vsix
          path: vscode-ext-demo-*.vsix
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Job summary
        run: |
          file="vscode-ext-demo-${TAG#v}.vsix"
          echo "Packaged \`$file\` from \`$TAG\`, SHA-256 \`$(sha256sum "$file" | cut -d ' ' -f 1)\`." \
            >> "$GITHUB_STEP_SUMMARY"

  # The only job that can write to the release: no checkout, no npm.
  publish:
    needs: [find-release, package]
    if: ${{ !cancelled() && needs.package.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ needs.find-release.outputs.tag }}
    steps:
      - name: Download the .vsix
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-vsix
      # --clobber: replaces the file if only this job is rerun or an earlier upload broke off.
      - name: Attach the .vsix to the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" --repo "$REPO" --clobber "vscode-ext-demo-${TAG#v}.vsix"
      - name: Job summary
        env:
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.find-release.outputs.tag }}
        run: |
          file="vscode-ext-demo-${TAG#v}.vsix"
          echo "Attached \`$file\` to [$TAG]($RELEASE_URL), SHA-256 \`$(sha256sum "$file" | cut -d ' ' -f 1)\`." \
            >> "$GITHUB_STEP_SUMMARY"
