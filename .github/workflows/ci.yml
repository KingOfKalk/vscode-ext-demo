name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up
        uses: ./.github/actions/setup
      # Every check runs even if an earlier one failed; the job still fails.
      - name: Format
        run: npm run format:check
      - name: Lint
        if: success() || failure()
        run: npm run lint
      - name: Typecheck
        if: success() || failure()
        run: npm run typecheck

  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up
        uses: ./.github/actions/setup
      - name: Unit tests
        run: npm test

  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up
        uses: ./.github/actions/setup
      - name: Package
        run: npm run package
      - name: Check the .vsix
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(vscode-ext-demo-*.vsix)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "expected exactly one .vsix, found ${#files[@]}" >&2
            exit 1
          fi
          npm run check:vsix -- "${files[0]}"
      - name: Short SHA of the commit under test
        id: sha
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          full="${PR_HEAD_SHA:-$PUSH_SHA}"
          echo "short=${full:0:7}" >> "$GITHUB_OUTPUT"
      - name: Upload the .vsix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix-${{ steps.sha.outputs.short }}
          path: vscode-ext-demo-*.vsix
          if-no-files-found: error
          retention-days: 14
