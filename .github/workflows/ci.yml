name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # pipefail: a failing command in front of `tee` still fails the step.
    shell: bash -euo pipefail {0}

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up
        id: setup
        uses: ./.github/actions/setup
      - name: Create log directory
        run: mkdir -p "$RUNNER_TEMP/logs"
      # Every check runs even if an earlier one failed, but not after a failed setup.
      # The job still fails.
      - name: Format
        id: format
        run: npm run format:check 2>&1 | tee "$RUNNER_TEMP/logs/format.log"
      - name: Lint
        id: lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run lint 2>&1 | tee "$RUNNER_TEMP/logs/lint.log"
      - name: Typecheck
        id: typecheck
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run typecheck 2>&1 | tee "$RUNNER_TEMP/logs/typecheck.log"
      - name: Job summary
        if: ${{ !cancelled() }}
        env:
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
        run: |
          node scripts/ci-summary.mjs steps --title "Lint" \
            --step "Format=$FORMAT_OUTCOME=$RUNNER_TEMP/logs/format.log" \
            --step "Lint=$LINT_OUTCOME=$RUNNER_TEMP/logs/lint.log" \
            --step "Typecheck=$TYPECHECK_OUTCOME=$RUNNER_TEMP/logs/typecheck.log" \
            >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up
        uses: ./.github/actions/setup
      # The JSON report feeds the job summary. Naming the reporters here also turns off Vitest's
      # built-in github-actions reporter, which would add a second, less detailed summary.
      - name: Unit tests
        id: test
        run: npm test -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest.json"
      - name: Job summary
        if: ${{ !cancelled() }}
        env:
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          node scripts/ci-summary.mjs test --report "$RUNNER_TEMP/vitest.json" --root "$GITHUB_WORKSPACE" \
            --outcome "$TEST_OUTCOME" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: test
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up
        uses: ./.github/actions/setup
      - name: Create log directory
        run: mkdir -p "$RUNNER_TEMP/logs"
      - name: Package
        id: package
        run: npm run package 2>&1 | tee "$RUNNER_TEMP/logs/package.log"
      - name: Check the .vsix
        id: check
        run: |
          shopt -s nullglob
          files=(vscode-ext-demo-*.vsix)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "expected exactly one .vsix, found ${#files[@]}" | tee "$RUNNER_TEMP/logs/check.log" >&2
            exit 1
          fi
          npm run check:vsix -- "${files[0]}" 2>&1 | tee "$RUNNER_TEMP/logs/check.log"
      - name: Artifact name with the short SHA of the commit under test
        id: artifact
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          full="${PR_HEAD_SHA:-$PUSH_SHA}"
          echo "name=vsix-${full:0:7}" >> "$GITHUB_OUTPUT"
      - name: Upload the .vsix
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: vscode-ext-demo-*.vsix
          if-no-files-found: error
          retention-days: 14
      - name: Job summary
        if: ${{ !cancelled() }}
        env:
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          shopt -s nullglob
          files=(vscode-ext-demo-*.vsix)
          args=()
          if [ "${#files[@]}" -eq 1 ]; then
            args+=(--vsix "${files[0]}" --artifact-url "$ARTIFACT_URL")
          fi
          node scripts/ci-summary.mjs build --title "Build" \
            --step "Package=$PACKAGE_OUTCOME=$RUNNER_TEMP/logs/package.log" \
            --step "Check the .vsix=$CHECK_OUTCOME=$RUNNER_TEMP/logs/check.log" \
            --step "Upload=$UPLOAD_OUTCOME=" \
            "${args[@]}" \
            >> "$GITHUB_STEP_SUMMARY"

  smoke:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up
        uses: ./.github/actions/setup
      - name: Install system packages
        run: scripts/install-system-deps.sh
      - name: Minimum VS Code version
        id: vscode
        run: |
          version="$(jq -er '.engines.vscode | ltrimstr("^")' package.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Only the archive: scripts/vscode.mjs compares its SHA-256 before every use.
      - name: Cache VS Code
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vscode-test/*.tar.gz
          key: vscode-${{ steps.vscode.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
      - name: Download the .vsix
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
      - name: Smoke tests
        id: smoke
        run: |
          shopt -s nullglob
          files=(vscode-ext-demo-*.vsix)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "expected exactly one .vsix, found ${#files[@]}" >&2
            exit 1
          fi
          npm run test:smoke -- --report "$RUNNER_TEMP/smoke.json" "${files[0]}"
      - name: Job summary
        if: ${{ !cancelled() }}
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          VSCODE_VERSION: ${{ steps.vscode.outputs.version }}
        run: |
          node scripts/ci-summary.mjs test --title "Smoke tests in VS Code $VSCODE_VERSION" \
            --report "$RUNNER_TEMP/smoke.json" --root "$GITHUB_WORKSPACE" \
            --outcome "$SMOKE_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
