name: Dependabot auto-merge

on:
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  automerge:
    # The author, not `github.actor`: the actor is whoever caused the latest event.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Also checks that the first commit is a verified Dependabot commit.
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # The script of the base branch, never the one of the pull request.
      - name: Check out the decision script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: scripts/dependabot-automerge.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Decide
        id: decision
        env:
          UPDATED_DEPENDENCIES: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: node scripts/dependabot-automerge.mjs
      # App token instead of GITHUB_TOKEN, so the merge to main starts CI and the release workflow.
      # Dependabot runs read the Dependabot secrets of the same names. Only GitHub Actions updates
      # change workflow files; an empty permission input grants nothing.
      - name: Create the App token
        id: app-token
        if: steps.decision.outputs.automerge == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: ${{ steps.metadata.outputs.package-ecosystem == 'github_actions' && 'write' || '' }}
      # GitHub merges once the required checks of the ruleset pass.
      - name: Enable auto-merge
        if: steps.decision.outputs.automerge == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
